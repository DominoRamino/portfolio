<head>

    content="Kubernetes, GitOps, and Azure platform engineering. Also available as a k9s terminal.">
  <meta property="og:url" content="https://ramymahi.dev">
  <link rel="icon"
    href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='6' fill='%23101720'/%3E%3Ctext x='16' y='22' font-family='monospace' font-size='16' font-weight='700' text-anchor='middle' fill='%23F0863A'%3E%3E_%3C/text%3E%3C/svg%3E">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:ital,wght@0,400;0,500;0,600;1,400&family=JetBrains+Mono:wght@400;700&display=swap"
    rel="stylesheet">
  <link rel="stylesheet" href="assets/css/recruiter.css?v=4">

</head>

<body>
  <a class="skip" href="#main">Skip to content</a>

  <div id="recruiter">
    <!-- rendered by recruiter.js -->
  </div>

  <div id="k9s" hidden aria-label="k9s style terminal view of this resume">
    <!-- rendered by k9s.js -->
  </div>

  <script src="assets/js/data.js?v=3"></script>
  <script src="assets/js/recruiter.js?v=5"></script>
  <script src="assets/js/k9s.js?v=3"></script>
  <script>
    (function () {
      var recruiter = document.getElementById('recruiter');
      var k9s = document.getElementById('k9s');
      var mounted = false;

      function route() {
        var h = location.hash || '';
        if (h.indexOf('#k9s') === 0) {
          recruiter.hidden = true;
          k9s.hidden = false;
          document.documentElement.classList.add('in-k9s');
          if (!mounted) { K9S.mount(k9s, window.RAMY, { onQuit: quit }); mounted = true; }
          K9S.open(h.slice(4));
        } else {
          k9s.hidden = true;
          recruiter.hidden = false;
          document.documentElement.classList.remove('in-k9s');
        }
      }
      function quit() {
        history.pushState('', document.title, location.pathname + location.search);
        route();
        window.scrollTo(0, 0);
      }
      RECRUITER.render(recruiter, window.RAMY);
      window.addEventListener('hashchange', route);
      route();
    })();
  </script>
</body>

</html>
